<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.json">
<title>Therapy Tracker</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f5f7fb;
  color:#172033;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

header{
  background:#2563eb;
  color:#fff;
  padding:24px 18px;
  border-radius:0 0 24px 24px
}

h1{
  margin:0;
  font-size:25px
}

header p{
  margin:5px 0 0;
  opacity:.9
}

main{
  max-width:720px;
  margin:auto;
  padding:16px 16px 100px
}

.cards{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px
}

.card,.panel,.session{
  background:#fff;
  border-radius:16px;
  padding:15px;
  box-shadow:0 3px 14px #0000000b
}

.num{
  font-size:27px;
  font-weight:700
}

.small{
  font-size:13px;
  color:#667085
}

.panel{
  margin-top:18px
}

.panel h2{
  font-size:18px;
  margin:0 0 12px
}

button{
  border:0;
  border-radius:11px;
  padding:11px 14px;
  font-size:15px;
  font-weight:650;
  cursor:pointer
}

.primary{
  background:#2563eb;
  color:#fff;
  width:100%
}

.light{
  background:#e8eefc;
  color:#174ea6
}

.danger{
  background:#fee2e2;
  color:#991b1b
}

label{
  display:block;
  font-size:13px;
  color:#667085;
  margin:10px 0 5px
}

input,select,textarea{
  width:100%;
  padding:12px;
  border:1px solid #d7dce5;
  border-radius:10px;
  font-size:16px;
  background:#fff
}

textarea{
  min-height:75px
}

.session{
  margin:9px 0;
  display:flex;
  justify-content:space-between;
  gap:10px
}

.session strong{
  display:block
}

.badge{
  height:max-content;
  padding:6px 9px;
  border-radius:20px;
  font-size:12px;
  font-weight:700;
  white-space:nowrap
}

.attended{
  background:#dcfce7;
  color:#166534
}

.missed{
  background:#fee2e2;
  color:#991b1b
}

.planned{
  background:#dbeafe;
  color:#1d4ed8
}

.rescheduled{
  background:#fef3c7;
  color:#92400e
}

.actions{
  display:flex;
  gap:7px;
  margin-top:9px
}

.actions button{
  padding:7px 9px;
  font-size:12px
}

nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#fff;
  border-top:1px solid #e5e7eb;
  display:flex;
  justify-content:space-around;
  padding:8px 4px calc(8px + env(safe-area-inset-bottom));
  z-index:4
}

nav button{
  background:none;
  color:#667085;
  min-width:30%
}

nav .active{
  color:#2563eb
}

.hidden{
  display:none
}

.empty{
  text-align:center;
  color:#667085;
  padding:20px
}
</style>
</head>

<body>

<header>
  <h1>Therapy Tracker</h1>
  <p>Track your sessions & attendance</p>
</header>

<main>

<!-- HOME -->
<section id="home">

  <div class="cards">

    <div class="card">
      <div class="num" id="total">0</div>
      <div class="small">Total sessions</div>
    </div>

    <div class="card">
      <div class="num" id="attended">0</div>
      <div class="small">Attended</div>
    </div>

    <div class="card">
      <div class="num" id="missed">0</div>
      <div class="small">Missed</div>
    </div>

    <div class="card">
      <div class="num" id="rate">0%</div>
      <div class="small">Attendance</div>
    </div>

  </div>

  <div class="panel">
    <h2>Next session</h2>
    <div id="next" class="empty">
      No upcoming sessions
    </div>
  </div>

  <div class="panel">
    <h2>Recent visits</h2>
    <div id="recent"></div>
  </div>

</section>


<!-- ADD -->
<section id="add" class="hidden">

  <div class="panel">

    <h2>Add therapy session</h2>

    <form id="sessionForm">

      <label>Date</label>
      <input id="date" type="date" required>

      <label>Time</label>
      <input id="time" type="time">

      <label>Therapy / Session type</label>
      <input
        id="type"
        placeholder="Physiotherapy"
        required
      >

      <label>Therapist</label>
      <input
        id="therapist"
        placeholder="Therapist name"
      >

      <label>Status</label>

      <select id="status">
        <option>Planned</option>
        <option>Attended</option>
        <option>Missed</option>
        <option>Rescheduled</option>
      </select>

      <label>Notes</label>

      <textarea
        id="notes"
        placeholder="Exercises, observations, follow-up..."
      ></textarea>

      <button
        type="submit"
        class="primary">
        Save session
      </button>

    </form>

  </div>

</section>


<!-- HISTORY -->
<section id="history" class="hidden">

  <div class="panel">

    <h2>Session history</h2>

    <div id="all"></div>

  </div>

</section>

</main>


<!-- NAVIGATION -->
<nav>

  <button
    type="button"
    class="active"
    data-page="home">

    🏠<br>
    Home

  </button>

  <button
    type="button"
    data-page="add">

    ➕<br>
    Add

  </button>

  <button
    type="button"
    data-page="history">

    📋<br>
    History

  </button>

</nav>


<script>

"use strict";


/* =========================
   STORAGE
========================= */

const STORAGE_KEY = "therapySessions";


function loadSessions(){

  try{

    const data =
      JSON.parse(
        localStorage.getItem(STORAGE_KEY) || "[]"
      );

    return Array.isArray(data)
      ? data.filter(Boolean)
      : [];

  }catch(error){

    console.error(
      "Unable to load sessions:",
      error
    );

    return [];

  }

}


let sessions = loadSessions();


/* =========================
   HELPER
========================= */

function el(id){

  return document.getElementById(id);

}


/* =========================
   SAVE DATA
========================= */

function saveSessions(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(sessions)
  );

}


/* =========================
   NAVIGATION
========================= */

function show(page){

  ["home","add","history"].forEach(id => {

    el(id).classList.toggle(
      "hidden",
      id !== page
    );

  });


  document
    .querySelectorAll("nav button")
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.page === page
      );

    });


  render();

}


/* Connect Home / Add / History buttons */

document
  .querySelectorAll("nav button")
  .forEach(button => {

    button.addEventListener(
      "click",
      function(){

        show(
          this.dataset.page
        );

      }
    );

  });


/* =========================
   DATE FORMAT
========================= */

function formatDate(date,time){

  if(!date){

    return "";

  }


  const value =
    time
      ? date + "T" + time
      : date + "T00:00";


  const d = new Date(value);


  if(
    Number.isNaN(
      d.getTime()
    )
  ){

    return date +
      (time ? " • " + time : "");

  }


  return d.toLocaleDateString(
    "en-IN",
    {
      day:"2-digit",
      month:"short",
      year:"numeric"
    }
  ) +
  (
    time
      ? " • " + time
      : ""
  );

}


/* =========================
   ESCAPE TEXT
========================= */

function esc(value){

  return String(
    value ?? ""
  ).replace(
    /[&<>"']/g,
    function(c){

      return {

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"

      }[c];

    }
  );

}


/* =========================
   SESSION CARD
========================= */

function card(
  session,
  showActions
){

  const status =
    String(
      session.status ||
      "Planned"
    );


  const validStatuses = [
    "Attended",
    "Missed",
    "Planned",
    "Rescheduled"
  ];


  const safeStatus =
    validStatuses.includes(status)
      ? status
      : "Planned";


  return `

    <div class="session">

      <div>

        <strong>
          ${esc(
            session.type ||
            "Therapy Session"
          )}
        </strong>

        <div class="small">
          ${esc(
            formatDate(
              session.date,
              session.time
            )
          )}
        </div>

        <div class="small">

          ${esc(
            session.therapist || ""
          )}

          ${
            session.notes
              ? " • " +
                esc(session.notes)
              : ""
          }

        </div>


        ${
          showActions

          ?

          `

          <div class="actions">

            <button
              type="button"
              class="light"
              data-attend="${esc(session.id)}">

              Mark Attended

            </button>


            <button
              type="button"
              class="danger"
              data-delete="${esc(session.id)}">

              Delete

            </button>

          </div>

          `

          :

          ""

        }

      </div>


      <span
        class="badge ${safeStatus.toLowerCase()}">

        ${esc(safeStatus)}

      </span>

    </div>

  `;

}


/* =========================
   RENDER
========================= */

function render(){

  /* COUNTS */

  const total =
    sessions.length;


  const attended =
    sessions.filter(
      x =>
        x.status === "Attended"
    ).length;


  const missed =
    sessions.filter(
      x =>
        x.status === "Missed"
    ).length;


  el("total").textContent =
    total;


  el("attended").textContent =
    attended;


  el("missed").textContent =
    missed;


  const completed =
    attended + missed;


  el("rate").textContent =
    (
      completed
        ? Math.round(
            attended /
            completed *
            100
          )
        : 0
    ) + "%";


  /* SORT SESSIONS */

  const sorted =
    [...sessions].sort(
      (a,b) => {

        const aa =
          (a.date || "") +
          "T" +
          (a.time || "00:00");


        const bb =
          (b.date || "") +
          "T" +
          (b.time || "00:00");


        return aa.localeCompare(bb);

      }
    );


  /* NEXT SESSION */

  const now =
    new Date();


  const upcoming =
    sorted.find(
      x => {

        if(
          x.status !== "Planned" ||
          !x.date
        ){

          return false;

        }


        const d =
          new Date(
            x.date +
            "T" +
            (x.time || "23:59")
          );


        return d >= now;

      }
    );


  el("next").innerHTML =
    upcoming

      ? card(
          upcoming,
          false
        )

      : `
        <div class="empty">
          No upcoming sessions
        </div>
        `;


  /* RECENT VISITS */

  const recent =
    [...sorted]
      .reverse()
      .slice(0,5);


  el("recent").innerHTML =
    recent.length

      ?

      recent
        .map(
          x =>
            card(
              x,
              false
            )
        )
        .join("")

      :

      `
      <div class="empty">
        No visits yet
      </div>
      `;


  /* HISTORY */

  const history =
    [...sorted]
      .reverse();


  el("all").innerHTML =
    history.length

      ?

      history
        .map(
          x =>
            card(
              x,
              true
            )
        )
        .join("")

      :

      `
      <div class="empty">
        No sessions recorded
      </div>
      `;

}


/* =========================
   ADD SESSION
========================= */

el("sessionForm")
  .addEventListener(
    "submit",
    function(event){

      event.preventDefault();


      const session = {

        id:
          Date.now().toString(),

        date:
          el("date").value,

        time:
          el("time").value,

        type:
          el("type")
            .value
            .trim(),

        therapist:
          el("therapist")
            .value
            .trim(),

        status:
          el("status").value,

        notes:
          el("notes")
            .value
            .trim()

      };


      /* VALIDATION */

      if(
        !session.date ||
        !session.type
      ){

        alert(
          "Please enter the date and therapy/session type."
        );

        return;

      }


      /* ADD */

      sessions.push(
        session
      );


      /* SAVE */

      saveSessions();


      /* RESET FORM */

      event.target.reset();


      /* SET TODAY */

      el("date").value =
        new Date()
          .toISOString()
          .slice(0,10);


      /* DEFAULT STATUS */

      el("status").value =
        "Planned";


      /* GO HOME */

      show("home");

    }
  );


/* =========================
   HISTORY ACTIONS
========================= */

document.addEventListener(
  "click",
  function(event){

    /* MARK ATTENDED */

    const attendButton =
      event.target.closest(
        "[data-attend]"
      );


    if(attendButton){

      const id =
        attendButton.dataset.attend;


      sessions =
        sessions.map(
          x =>
            String(x.id) ===
            String(id)

              ? {
                  ...x,
                  status:
                    "Attended"
                }

              : x
        );


      saveSessions();

      render();

      return;

    }


    /* DELETE */

    const deleteButton =
      event.target.closest(
        "[data-delete]"
      );


    if(deleteButton){

      const id =
        deleteButton.dataset.delete;


      if(
        confirm(
          "Delete this session?"
        )
      ){

        sessions =
          sessions.filter(
            x =>
              String(x.id) !==
              String(id)
          );


        saveSessions();

        render();

      }

    }

  }
);


/* =========================
   INITIALIZE
========================= */

el("date").value =
  new Date()
    .toISOString()
    .slice(0,10);


render();

</script>

</body>
</html>
